<style>
/* Estádio à noite: placar de LED amarelo-canário sobre azul-petróleo; o gramado listrado é o protagonista. Tema único escuro, escolhido de propósito. */
:root{
  --noite:#0c1d26; --arquibancada:#13303c; --arquibancada-2:#183a48; --linha:#285263;
  --giz:#eef3ec; --nevoa:#9db7b4; --canarinho:#ffd23f; --canarinho-escuro:#2a2000;

  --f-corpo:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-dado:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--noite);color:var(--giz)}
body{font-family:var(--f-corpo);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--canarinho);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}

.marca{display:flex;align-items:center;gap:12px}
.marca h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4.4vw,34px);line-height:1;margin:0;color:var(--canarinho);letter-spacing:.02em;text-shadow:0 0 18px rgba(255,210,63,.35)}
.marca p{margin:2px 0 0;color:var(--nevoa);font-size:13px}
.coroa{width:42px;height:42px;flex:none}
.placar{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--arquibancada);border:1px solid var(--linha);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;min-width:92px}
.chip small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--nevoa)}
.chip b{font-family:var(--f-dado);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--giz)}

nav.abas{display:flex;gap:4px;overflow-x:auto;margin:12px 0 18px;scrollbar-width:none}
nav.abas button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;font-size:15px;color:var(--nevoa);cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
nav.abas button[aria-selected="true"]{color:var(--canarinho);border-bottom-color:var(--canarinho)}
nav.abas button:hover{color:var(--giz)}

h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 10px;letter-spacing:.02em;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--nevoa);margin:0 0 8px}
.card{background:var(--arquibancada);border:1px solid var(--linha);border-radius:12px;padding:16px;min-width:0}
.grade{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));align-items:start}
.muted{color:var(--nevoa)}

.mini-acoes{display:flex;gap:3px}

.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}

.st{font-weight:600}.st-P{color:var(--bom)}.st-D{color:var(--aviso)}.st-R{color:var(--nevoa)}.st-L,.st-S{color:var(--ruim)}
.mv{color:var(--giz)} .mv.est{color:var(--nevoa);font-style:italic}

.overlay{position:absolute;inset:0;background:rgba(8,20,27,.78);display:grid;place-items:center;padding:20px;text-align:center}
.overlay .caixa{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:320px}

.fases{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}

.zona-g4 td:first-child{box-shadow:inset 3px 0 0 var(--bom)}
.zona-z4 td:first-child{box-shadow:inset 3px 0 0 var(--ruim)}

.forma .V{background:var(--bom)}.forma .E{background:var(--nevoa)}.forma .D{background:var(--ruim)}

.regras p,.regras li{max-width:68ch}

<script>
'use strict';
/* ======================= utilitários ======================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r2=v=>Math.round(v*100)/100;
const clone=o=>JSON.parse(JSON.stringify(o));
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function sorteioPeso(itens,peso){const ws=itens.map(peso);const s=ws.reduce((a,b)=>a+b,0);let x=Math.random()*s;for(let i=0;i<itens.length;i++){x-=ws[i];if(x<=0)return itens[i]}return itens[itens.length-1]}
const fmt=v=>(v==null?'–':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}));
const fmtM=v=>'M$ '+fmt(v);
const fmtEuro=v=>v==null?'–':v>=1?'€ '+v.toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi':'€ '+Math.round(v*1000)+' mil';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=sel=>document.querySelector(sel);
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4200)}

/* ======================= dados reais (dados.js) ======================= */
// Força do clube vem do valor de mercado total do elenco (Transfermarkt): 62 (menor) a 86 (maior)
const VMIN=Math.min(...CLUBES_RAW.map(c=>c[4])),VMAX=Math.max(...CLUBES_RAW.map(c=>c[4]));
const CLUBES=CLUBES_RAW.map(([sig,nome,c1,c2,valor],id)=>({id,sig,nome,c1,c2,valor,forca:Math.round(62+24*(Math.log(valor)-Math.log(VMIN))/(Math.log(VMAX)-Math.log(VMIN)))}));
const POS=['GOL','LAT','ZAG','MEI','ATA','TEC'];
const POS_NOME={GOL:'Goleiro',LAT:'Lateral',ZAG:'Zagueiro',MEI:'Meia',ATA:'Atacante',TEC:'Técnico'};
const STATUS={P:'Provável',D:'Dúvida',R:'Reserva',L:'Lesionado',S:'Suspenso'};
// Escala logarítmica do valor de mercado (€ mi): 0 (sem valor) a ~1 (€ 32 mi)
const nivel=v=>Math.log(1+4*v)/Math.log(129);
const PLAYERS=[],PMAP={};
(function montarJogadores(){
  const r=mulberry32(2026);
  const porPos={};
  for(const j of JOGADORES_RAW)if(j[5]!=null)(porPos[j[2]]=porPos[j[2]]||[]).push(j[5]);
  const mediana={};for(const p in porPos){const a=porPos[p].sort((x,y)=>x-y);mediana[p]=a[Math.floor(a.length/2)]}
  for(const [id,nome,pos,det,clube,valor,idade] of JOGADORES_RAW){
    const est=valor==null,v=est?mediana[pos]:valor,n=nivel(v);
    const preco=r2(clamp(1.5+19*Math.pow(n,1.6),1.5,22));
    const p={id,nome,pos,det,clube,valor,est,idade,rating:Math.round(52+38*n),preco0:preco,media0:r2(Math.max(0.5,preco*0.38+(r()-0.3)*1.4))};
    PLAYERS.push(p);PMAP[id]=p;
  }
  for(const c of CLUBES){
    const preco=r2(3+(c.forca-62)/24*11);
    const p={id:'tec'+c.sig,nome:'Técnico do '+c.nome,pos:'TEC',det:'Técnico',clube:c.id,valor:null,est:false,idade:null,rating:c.forca,preco0:preco,media0:r2(preco*0.4)};
    PLAYERS.push(p);PMAP[p.id]=p;
  }
})();
const BOTS=['Várzea Raiz FC','Os Boleiros','Chuteira de Ouro','Bola na Rede EC','Resenha FC','Zagueiro Artilheiro','Tabelinha SC','Pelada de Domingo','Camisa 10 FC'];

 '4-3-3':{GOL:1,LAT:2,ZAG:2,MEI:3,ATA:3,TEC:1},'4-4-2':{GOL:1,LAT:2,ZAG:2,MEI:4,ATA:2,TEC:1},

const SCOUTS={
 G:{n:'Gol',v:8},A:{n:'Assistência',v:5},FT:{n:'Finalização na trave',v:3},FD:{n:'Finalização defendida',v:1.2},
 FF:{n:'Finalização para fora',v:0.8},FS:{n:'Falta sofrida',v:0.5},DS:{n:'Desarme',v:1.2},SG:{n:'Jogo sem sofrer gol (GOL, ZAG, LAT)',v:5},

 CA:{n:'Cartão amarelo',v:-1},CV:{n:'Cartão vermelho',v:-3},V:{n:'Vitória (técnico)',v:6},E:{n:'Empate (técnico)',v:2},

const CALENDARIO=(function(){
  const n=CLUBES.length;let arr=[...Array(n).keys()];const ida=[];
  for(let r=0;r<n-1;r++){const jogos=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if((r+i)%2)[h,a]=[a,h];jogos.push([h,a])}ida.push(jogos);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  return ida.concat(ida.map(js=>js.map(([h,a])=>[a,h])));

function escalarTitulares(N,clubeId){
  const need={GOL:1,LAT:2,ZAG:2,MEI:3,ATA:3},tit=[],usado=new Set();
  const ok=p=>{const s=N.pl[p.id].status;return s!=='L'&&s!=='S'};
  const doClube=PLAYERS.filter(p=>p.clube===clubeId&&p.pos!=='TEC'&&ok(p));
  for(const pos in need){
    const l=doClube.filter(p=>p.pos===pos).sort((a,b)=>b.rating-a.rating);let n=0;
    const tenta=(arr,chance)=>{for(const p of arr){if(n>=need[pos])break;if(!usado.has(p.id)&&Math.random()<chance){tit.push(p);usado.add(p.id);n++}}};
    tenta(l.filter(p=>N.pl[p.id].status==='P'),0.93);tenta(l.filter(p=>N.pl[p.id].status==='D'),0.55);tenta(l,1);
  }
  for(const p of doClube.filter(p=>p.pos!=='GOL').sort((a,b)=>b.rating-a.rating)){if(tit.length>=11)break;if(!usado.has(p.id)){tit.push(p);usado.add(p.id)}}
  return tit;
}
const P_GOL={GOL:0,LAT:0.8,ZAG:0.9,MEI:2.6,ATA:6},P_AST={GOL:0.05,LAT:2.6,ZAG:0.6,MEI:4.5,ATA:2.2},P_FIN={GOL:0,LAT:0.8,ZAG:0.7,MEI:3,ATA:5};
const L_DS={GOL:0.05,LAT:1.6,ZAG:1.5,MEI:1.4,ATA:0.4},L_FS={GOL:0.1,LAT:0.7,ZAG:0.4,MEI:1.0,ATA:1.1};
function ataque(xi,gols,dif,add){
  for(let g=0;g<gols;g++){
    const autor=sorteioPeso(xi,p=>P_GOL[p.pos]*p.rating/70);add(autor.id,'G');
    if(Math.random()<0.72){const outros=xi.filter(p=>p!==autor);if(outros.length)add(sorteioPeso(outros,p=>P_AST[p.pos]).id,'A')}
  }
  let fd=0;const chutes=poisson(Math.max(3,7.5+dif/5));
  for(let i=0;i<chutes;i++){const q=sorteioPeso(xi,p=>P_FIN[p.pos]*p.rating/70),x=Math.random();
    if(x<0.36){add(q.id,'FD');fd++}else if(x<0.41)add(q.id,'FT');else add(q.id,'FF')}
  for(const p of xi){
    const ds=poisson(L_DS[p.pos]);if(ds)add(p.id,'DS',ds);
    const fs=poisson(L_FS[p.pos]);if(fs)add(p.id,'FS',fs);
    const fc=poisson(p.pos==='ZAG'?1.1:0.7);if(fc)add(p.id,'FC',fc);
    if(p.pos==='ATA'){const i=poisson(0.45);if(i)add(p.id,'I',i)}
    if(Math.random()<0.11)add(p.id,'CA');
    if(Math.random()<0.012)add(p.id,'CV');
  }
  return fd;
}
function defesa(xi,sofridos,fdAdv,add){
  const gk=xi.find(p=>p.pos==='GOL');
  if(gk){if(fdAdv)add(gk.id,'DE',fdAdv);if(sofridos)add(gk.id,'GS',sofridos)}
  if(!sofridos)for(const p of xi)if(p.pos==='GOL'||p.pos==='LAT'||p.pos==='ZAG')add(p.id,'SG');
}
// Escalação automática: usada pelo botão e pelos rivais do modo solo
function escalarAuto(N,orcamento,formacao,ids0){
  const slots=[];for(const [pos,n] of Object.entries(FORMACOES[formacao]))for(let i=0;i<n;i++)slots.push(pos);
  const ordem=['ATA','MEI','TEC','ZAG','LAT','GOL'];slots.sort((a,b)=>ordem.indexOf(a)-ordem.indexOf(b));
  const d=id=>id==='CRQ'?dyn('CRQ'):N.pl[id];
  const ids=[];let resto=orcamento,falta=slots.length;
  for(const pos of slots){
    falta--;const reserva=falta*3;
    const daPos=ids0.filter(id=>info(id).pos===pos&&!ids.includes(id));
    const cabe=daPos.filter(id=>d(id).price<=resto-reserva);
    let cands=cabe.filter(id=>d(id).status==='P');
    if(!cands.length)cands=cabe.filter(id=>d(id).status==='D');
    if(!cands.length)cands=cabe.filter(id=>{const s=d(id).status;return s!=='L'&&s!=='S'});
    if(!cands.length)cands=daPos.filter(id=>d(id).price<=resto).sort((a,b)=>d(a).price-d(b).price).slice(0,1);
    if(!cands.length)continue;
    let melhor=null,mv=-1e9;
    for(const id of cands){const x=d(id),bonus={P:1.5,D:-0.5,R:-4}[x.status]||0,v=(x.media+1.5)*(0.6+Math.random()*0.8)+bonus;if(v>mv){mv=v;melhor=id}}
    ids.push(melhor);resto-=d(melhor).price;
  }
  const capitao=ids.filter(id=>info(id).pos!=='TEC').sort((a,b)=>d(b).media-d(a).media)[0]||null;
  return{ids,capitao,gasto:r2(orcamento-resto)};
}
function craqueScouts(t,N){
  if(!t?.carreira?.criado)return null;const p=t.carreira.pend;
  if(!p||p.rodada!==N.rodada||!p.fases)return null;
  const s={};for(const k of ['G','A','FD','FF'])if(p[k])s[k]=Math.min(p[k],3);return s;
}
// Simula a rodada N.rodada em N (cópia do mundo) para os times informados (id -> time)
function simularRodada(N,times){
  const rodada=N.rodada;
  const timesBots=(N.botNomes||[]).map((_,i)=>escalarAuto(N,100+(rodada-1)*0.9+i*0.6,Object.keys(FORMACOES)[(i+rodada)%6],PLAYERS.map(p=>p.id)));
  const sc={},add=(id,k,n=1)=>{const o=sc[id]||(sc[id]={});o[k]=(o[k]||0)+n};
  const resultados=[];
  for(const [h,a] of CALENDARIO[rodada-1]){
    const fh=CLUBES[h].forca+4,fa=CLUBES[a].forca;
    const gh=poisson(1.3*Math.pow(fh/fa,2)),ga=poisson(1.05*Math.pow(fa/fh,2));
    const th=escalarTitulares(N,h),ta=escalarTitulares(N,a);
    for(const p of th.concat(ta))sc[p.id]=sc[p.id]||{};
    const fdH=ataque(th,gh,fh-fa,add),fdA=ataque(ta,ga,fa-fh,add);
    defesa(th,ga,fdA,add);defesa(ta,gh,fdH,add);
    for(const [cid,gf,gc] of [[h,gh,ga],[a,ga,gh]]){
      const tec='tec'+CLUBES[cid].sig;sc[tec]=sc[tec]||{};
      add(tec,gf>gc?'V':gf===gc?'E':'D');if(gf!==gc)add(tec,'SD',gf-gc);
      const t=N.tabela[cid];t.J++;t.GP+=gf;t.GC+=gc;
      if(gf>gc){t.V++;t.P+=3;t.forma.push('V')}else if(gf===gc){t.E++;t.P+=1;t.forma.push('E')}else{t.D++;t.forma.push('D')}
      t.forma=t.forma.slice(-5);
    }
    resultados.push({h,a,gh,ga});
  }
  const pts={};for(const id in sc)pts[id]=pontos(sc[id]);
  const ultTimes={};
  for(const uid in times){
    const t=times[uid];if(!t)continue;
    const cs=craqueScouts(t,N),cp=cs?pontos(cs):0;
    const lista=(t.escalacao||[]).filter(id=>id==='CRQ'||PMAP[id]).map(id=>{
      const jogou=id==='CRQ'?!!cs:id in sc;let p=id==='CRQ'?cp:(pts[id]??0);
      if(id===t.capitao&&jogou)p=r2(p*CAPITAO_MULT);
      return{id,pts:p,sc:id==='CRQ'?cs:(sc[id]||null),jogou}});
    const total=r2(lista.reduce((s,x)=>s+x.pts,0));
    const rk=N.ranking[uid]||(N.ranking[uid]={total:0,last:null,hist:[]});
    rk.total=r2(rk.total+total);rk.last=total;rk.hist.push(total);
    ultTimes[uid]={pts:total,lista,capitao:t.capitao||null,craqueNome:t.carreira?.criado?t.carreira.nome:null};
    if(t.carreira?.criado){const cd=N.craques[uid]||(N.craques[uid]={media:0,jogos:0,total:0,last:null});
      if(cs){cd.media=r2((cd.media*cd.jogos+cp)/(cd.jogos+1));cd.jogos++;cd.total=r2(cd.total+cp);cd.last=cp}else cd.last=null}
  }
  timesBots.forEach((tb,i)=>{let s=0;for(const id of tb.ids){let p=pts[id]??0;if(id===tb.capitao)p*=CAPITAO_MULT;s+=p}
    const rk=N.ranking['bot'+i];rk.last=r2(s);rk.total=r2(rk.total+s);rk.hist.push(rk.last)});
  for(const p of PLAYERS){
    const d=N.pl[p.id],jogou=p.id in sc;
    if(jogou){const v=pts[p.id],n=Math.max(d.jogos,3),antes=d.media;d.jogos++;d.total=r2(d.total+v);d.media=r2((d.media*n+v)/(n+1));d.last=v;
      d.vari=r2(clamp((v-antes)*0.12,-2.5,2.5));d.price=r2(Math.max(1,d.price+d.vari))}
    else{d.last=null;d.vari=0}
    let bloq=false;
    if(d.out>0){d.out--;if(d.out>0)bloq=true}
    const s=sc[p.id];
    if(s&&s.CV){d.status='S';d.out=1;bloq=true}
    else if(s&&s.CA){d.ca++;if(d.ca>=3){d.ca=0;d.status='S';d.out=1;bloq=true}}
    if(!bloq){d.status='R';if(p.pos!=='TEC'&&Math.random()<0.03){d.status='L';d.out=1+Math.floor(Math.random()*3)}}
  }
  definirStatus(N);
  const destaques=Object.keys(pts).sort((a,b)=>pts[b]-pts[a]).slice(0,8).map(id=>({id,pts:pts[id],sc:sc[id]}));
  N.ultima={rodada,resultados,times:ultTimes,destaques};
  N.rodada++;
  return N;
}
let fechando=false;

function slotHtml(id,pos){

function renderCampo(){
  const f=FORMACOES[T.formacao],por={};for(const p of POS)por[p]=T.escalacao.filter(id=>info(id).pos===p);
  const linha=(pos,n)=>Array.from({length:n},(_,i)=>slotHtml(por[pos][i],pos)).join('');
  const lat=f.LAT?Array.from({length:f.LAT},(_,i)=>slotHtml(por.LAT[i],'LAT')):[];
  $('#campo').innerHTML=`<div class="campo">
    <div class="linha-campo">${linha('ATA',f.ATA)}</div>
    <div class="linha-campo">${linha('MEI',f.MEI)}</div>
    <div class="linha-campo">${(lat[0]||'')+linha('ZAG',f.ZAG)+(lat[1]||'')}</div>
    <div class="linha-campo">${linha('GOL',1)}</div>
    <div class="banco-tec"><span class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.08em">Técnico</span>${linha('TEC',1)}</div></div>`;

function renderMercado(){
  if(!$('#mercado'))return;
  renderCampo();
  const busca=filtros.busca.trim().toLowerCase();
  const val=id=>{const p=info(id);return p.craque?-1:p.valor??(p.pos==='TEC'?-2:-0.5)};
  let ids=todosIds().filter(id=>{const p=info(id),d=dyn(id);
    if(filtros.pos&&p.pos!==filtros.pos)return false;
    if(filtros.clube!==''&&String(p.clube)!==String(filtros.clube))return false;
    if(busca&&!p.nome.toLowerCase().includes(busca))return false;
    if(filtros.cabe&&!T.escalacao.includes(id)&&d.price>T.cash)return false;
    if(filtros.disp&&d.status!=='P')return false;return true});
  const o=filtros.ordem;
  ids.sort((a,b)=>{const A=dyn(a),B=dyn(b);
    if(o==='valor')return val(b)-val(a)||B.price-A.price;if(o==='media')return B.media-A.media;if(o==='preco-')return B.price-A.price;if(o==='preco+')return A.price-B.price;
    if(o==='ultima')return(B.last??-99)-(A.last??-99);if(o==='custo')return B.media/B.price-A.media/A.price;return info(a).nome.localeCompare(info(b).nome)});
  if(ids.includes('CRQ')&&!busca)ids=['CRQ'].concat(ids.filter(x=>x!=='CRQ'));
  const ro=MODO==='online'&&!podeEscrever;
  const html=ids.slice(0,200).map(id=>{const p=info(id),d=dyn(id),na=T.escalacao.includes(id);
    const mv=p.craque?'':p.pos==='TEC'?'':p.est?'<span class="mv est" title="Sem valor de mercado verificado: preço estimado pela mediana da posição">valor estimado</span>':`<span class="mv">${fmtEuro(p.valor)}</span>`;
    return`<div class="lm ${na?'na-equipe':''}">
      <span class="pc">${p.pos}</span>
      <div class="mn"><strong>${p.craque?'<span class="estrela">★</span> ':''}${esc(p.nome)}</strong><small>${escudo(p.clube)}${CLUBES[p.clube].sig} · ${esc(p.det)}${p.idade?' · '+p.idade+' anos':''}${mv?' · '+mv:''} · <span class="st st-${d.status}">${p.craque&&d.status==='D'?'Jogue a carreira':STATUS[d.status]}</span></small></div>
      <div class="val"><small>Média</small>${fmt(d.media)}</div>
      <div class="val ult"><small>Última</small>${d.last==null?'–':fmt(d.last)}</div>
      <div class="val"><small>Preço</small>${fmt(d.price)}${d.vari?`<em class="${d.vari>0?'up':'down'}"> ${d.vari>0?'▲':'▼'}${fmt(Math.abs(d.vari))}</em>`:''}</div>
      <button class="btn ${na?'vender':''}" data-act="${na?'vender':'comprar'}" data-id="${id}" ${ro?'disabled':''}>${na?'Vender':'Comprar'}</button></div>`}).join('');
  $('#mercado').innerHTML=(html||'<p class="muted" style="padding:12px">Nenhum jogador com esses filtros.</p>')+(ids.length>200?`<p class="muted" style="padding:10px">Mostrando 200 de ${ids.length}. Use os filtros para achar os demais.</p>`:'');
}
const travado=()=>{if(MODO==='online'&&!podeEscrever){toast('Você está só assistindo esta liga.');return true}if(M.rodada>TOTAL_RODADAS){toast('A temporada acabou.');return true}return false};
function comprar(id){
  if(travado())return;
  const p=info(id),d=dyn(id);
  if(T.escalacao.includes(id))return;
  if(vagas()[p.pos]<=0)return toast(`A formação ${T.formacao} não tem vaga livre de ${POS_NOME[p.pos].toLowerCase()}. Venda alguém dessa posição antes.`);
  if(d.price>T.cash+1e-9)return toast(`Faltam ${fmtM(d.price-T.cash)} para comprar ${p.nome}.`);
  T.cash=r2(T.cash-d.price);T.escalacao.push(id);
  if(!T.capitao&&p.pos!=='TEC')T.capitao=id;
  salvarTime();renderPlacar();renderMercado();
}
function vender(id){
  if(travado()||!T.escalacao.includes(id))return;
  T.cash=r2(T.cash+dyn(id).price);T.escalacao=T.escalacao.filter(x=>x!==id);
  if(T.capitao===id)T.capitao=null;
  salvarTime();renderPlacar();renderMercado();
}
function trocarFormacao(f){
  if(travado())return;
  T.formacao=f;const lim=FORMACOES[f];
  for(const pos of POS){const meus=T.escalacao.filter(id=>info(id).pos===pos);while(meus.length>lim[pos]){const id=meus.pop();T.cash=r2(T.cash+dyn(id).price);T.escalacao=T.escalacao.filter(x=>x!==id);if(T.capitao===id)T.capitao=null}}
  salvarTime();renderPlacar();renderMercado();
}
function autoEscalar(){
  if(travado())return;
  const orc=patrimonio();
  const t=escalarAuto(M,orc,T.formacao,todosIds());
  T.escalacao=t.ids;T.capitao=t.capitao;T.cash=r2(orc-t.gasto);
  salvarTime();renderPlacar();renderMercado();toast(`Time montado em ${T.formacao}. Confira o capitão e ajuste o que quiser.`);
}

function sparkSvg(vals){
  const W=300,H=60,max=Math.max(...vals,1),min=Math.min(...vals,0),n=vals.length;
  const x=i=>n===1?W/2:6+i*(W-12)/(n-1),y=v=>H-6-(v-min)/(max-min||1)*(H-12);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Pontos por rodada"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#285263" stroke-width="1"/>
    <polygon points="${x(0)},${y(min)} ${pts} ${x(n-1)},${y(min)}" fill="rgba(255,210,63,.15)"/><polyline points="${pts}" fill="none" stroke="#ffd23f" stroke-width="2"/>
    <circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="3.5" fill="#ffd23f"/></svg>`;
}

/* ======================= Carreira: o jogo de desenhar o passe ======================= */
const W=400,H=600,GOL_X1=160,GOL_X2=240,GOL_Y=20,MAX_TRACO=480,VEL=420;
const J={n:1,L:null,estado:'parado',traco:[],bola:{x:0,y:0},dono:0,toques:0,passes:0,ultimoPasse:null,voo:null,raf:0,t0:0,cv:null,ctx:null,dpr:1,len:0,alvo:null};
function gerarFase(n){
  const r=mulberry32(n*7919+101),C=T.carreira;
  const nComp=Math.min(3+Math.floor((n+1)/7),6);
  const nDef=Math.min(2+Math.floor(n*0.4),10);
  const longe=(p,arr,d)=>arr.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>=d);
  const comp=[{x:Math.round(110+r()*180),y:540}];
  let t=0;while(comp.length<nComp+1&&t<800){t++;const p={x:Math.round(50+r()*300),y:Math.round(130+r()*340)};if(longe(p,comp,85))comp.push(p)}
  const def=[];t=0;
  while(def.length<nDef&&t<3000){t++;let p;
    if(r()<0.55&&comp.length>1){const a=pick(r,comp),b=pick(r,comp);if(a===b)continue;const k=0.35+r()*0.3;p={x:a.x+(b.x-a.x)*k+(r()-0.5)*30,y:a.y+(b.y-a.y)*k+(r()-0.5)*30}}
    else p={x:40+r()*320,y:70+r()*420};
    p.x=Math.round(clamp(p.x,30,370));p.y=Math.round(clamp(p.y,66,500));
    if(longe(p,comp,52)&&longe(p,def,38))def.push({x:p.x,y:p.y,hx:p.x,hy:p.y});
  }
  const obj=n===1?'gol':n%4===0?'craque':n%5===0?'passes3':'gol';
  const par=obj==='passes3'?4:Math.max(2,Math.round(nComp*0.6)+1);
  let adv=CLUBES[(n*7+3)%20];if(adv.id===C.clube)adv=CLUBES[(adv.id+1)%20];
  const minuto=70+Math.floor(r()*21),cenario=pick(r,['Empate em 1 a 1. O gol da vitória é seu.','Perdendo de 1 a 0. Falta pouco para o fim.','0 a 0 em clássico. Decida o jogo.','2 a 2 fora de casa. Busque a vitória.','Final de copa empatada. Faça o gol do título.']);
  const k=Math.min(n,30);
  return{n,comp,def,goleiro:{x:200+(r()-0.5)*24,y:36},craque:n%3===1?0:1+Math.floor(r()*nComp),obj,par,maxToques:par+3,adv,minuto,cenario,
    alcDef:12+k*0.12,velDef:28+k*1.8,visao:80+k,alcGol:14+k*0.35,velGol:60+k*1.6};
}
function iniciarFase(n){
  J.n=n;J.L=gerarFase(n);J.estado='parado';J.traco=[];J.dono=0;J.toques=0;J.passes=0;J.ultimoPasse=null;J.voo=null;J.alvo=null;
  const d=J.L.comp[0];J.bola={x:d.x,y:d.y};
  const ov=$('#overlay');if(ov)ov.hidden=true;
  atualizarHud();
  dica(n===1?'Arraste a partir da bola (anel amarelo) e solte em cima de um companheiro para passar. Solte dentro do gol para chutar.':'Desenhe curvas para fugir das áreas vermelhas dos marcadores.');
}
const objTexto=L=>L.obj==='craque'?'Objetivo: gol do seu craque ★':L.obj==='passes3'?'Objetivo: gol com 3 passes ou mais':'Objetivo: marque o gol';
function atualizarHud(){
  const L=J.L;if(!L||!$('#hud'))return;
  const c=CLUBES[T.carreira.clube];
  $('#hud').innerHTML=`<span class="obj">${objTexto(L)}</span><span>Toques ${J.toques}/${L.maxToques} · 3★ com até ${L.par}</span>`;
  $('#contexto').innerHTML=`Fase ${L.n} · ${escudo(c.id)} ${c.sig} x ${L.adv.sig} ${escudo(L.adv.id)} · ${L.minuto}' · ${L.cenario}`;
}
function dica(t){const e=$('#dica');if(e)e.textContent=t}
function ptr(e){const r=J.cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function alvoDoTraco(){
  const fim=J.traco[J.traco.length-1];
  let melhor=null,md=34;
  J.L.comp.forEach((c,i)=>{if(i===J.dono)return;const d=Math.hypot(c.x-fim.x,c.y-fim.y);if(d<md){md=d;melhor=i}});
  if(melhor!=null)return{tipo:'passe',i:melhor};
  if(fim.y<56&&fim.x>GOL_X1-10&&fim.x<GOL_X2+10)return{tipo:'chute'};
  return null;
}
function ligarEntrada(cv){
  cv.addEventListener('pointerdown',e=>{
    if(J.estado!=='parado')return;
    const p=ptr(e),d=J.L.comp[J.dono];
    if(Math.hypot(p.x-d.x,p.y-d.y)>38){dica('Comece o traço em cima da bola, no jogador com o anel amarelo.');return}
    J.estado='desenhando';J.traco=[{x:d.x,y:d.y}];J.len=0;J.alvo=null;
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{
    if(J.estado!=='desenhando')return;
    const p=ptr(e),u=J.traco[J.traco.length-1],dd=Math.hypot(p.x-u.x,p.y-u.y);
    if(dd>=5&&J.len+dd<=MAX_TRACO){J.traco.push({x:clamp(p.x,4,W-4),y:clamp(p.y,2,H-4)});J.len+=dd;J.alvo=alvoDoTraco()}
    e.preventDefault();
  });
  const soltar=()=>{if(J.estado==='desenhando')finalizarTraco()};
  cv.addEventListener('pointerup',soltar);cv.addEventListener('pointercancel',soltar);
}
function finalizarTraco(){
  if(J.len<25){J.estado='parado';J.traco=[];return}
  const alvo=alvoDoTraco();
  if(!alvo){const limite=J.len>MAX_TRACO-15;J.estado='parado';J.traco=[];dica(limite?'O traço chegou ao limite de força antes do alvo. Toque para um companheiro mais perto e chute de lá. Não gastou toque.':'O traço precisa terminar em um companheiro ou dentro do gol. Tente de novo, não gastou toque.');return}
  const fim=J.traco[J.traco.length-1];
  if(alvo.tipo==='passe'){const c=J.L.comp[alvo.i];J.traco.push({x:c.x,y:c.y})}
  else J.traco.push({x:clamp(fim.x,GOL_X1-10,GOL_X2+10),y:0});
  const cum=[0];for(let i=1;i<J.traco.length;i++)cum.push(cum[i-1]+Math.hypot(J.traco[i].x-J.traco[i-1].x,J.traco[i].y-J.traco[i-1].y));
  J.voo={tipo:alvo.tipo,alvo:alvo.i,pts:J.traco.slice(),cum,total:cum[cum.length-1],s:0,chutador:J.dono};
  J.toques++;J.estado='voando';J.traco=[];atualizarHud();
}
function posNoTraco(v,s){
  const c=v.cum;let i=1;while(i<c.length-1&&c[i]<s)i++;
  const a=v.pts[i-1],b=v.pts[i],seg=(c[i]-c[i-1])||1,k=clamp((s-c[i-1])/seg,0,1);
  return{x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k};
}
function atualizar(dt){
  if(J.estado!=='voando')return;
  const v=J.voo,L=J.L;
  v.s=Math.min(v.s+VEL*dt*(v.tipo==='chute'?1.3:1),v.total);
  const b=posNoTraco(v,v.s);J.bola=b;
  for(const d of L.def){
    const dist=Math.hypot(b.x-d.x,b.y-d.y);
    if(dist<L.visao&&dist>0.1){const passo=Math.min(L.velDef*dt,dist);const nx=d.x+(b.x-d.x)/dist*passo,ny=d.y+(b.y-d.y)/dist*passo;
      if(Math.hypot(nx-d.hx,ny-d.hy)<70){d.x=nx;d.y=ny}}
    if(Math.hypot(b.x-d.x,b.y-d.y)<L.alcDef+6)return terminar(false,'Interceptado! O marcador chegou na bola.',v.tipo==='chute'?'FF':null);
  }
  const g=L.goleiro;
  if(b.y<165){const dx=b.x-g.x;g.x+=clamp(dx,-L.velGol*dt,L.velGol*dt);g.x=clamp(g.x,GOL_X1+6,GOL_X2-6)}
  if(Math.hypot(b.x-g.x,b.y-g.y)<L.alcGol+6)return terminar(false,v.tipo==='chute'?'Defesa do goleiro! Tente uma curva para o canto.':'O goleiro saiu e ficou com a bola.',v.tipo==='chute'?'FD':null);
  if(v.tipo==='chute'&&b.y<=GOL_Y){
    if(b.x>GOL_X1+5&&b.x<GOL_X2-5)return terminar(true);
    return terminar(false,'Pra fora! Termine o traço entre as traves.','FF');
  }
  if(v.s>=v.total&&v.tipo==='passe'){
    J.ultimoPasse=J.dono;J.dono=v.alvo;J.passes++;J.voo=null;J.estado='parado';
    J.L.comp.forEach((c,i)=>{if(i!==J.dono)c.y=Math.max(110,c.y-10)});
    atualizarHud();
    if(J.toques>=L.maxToques)return terminar(false,'Acabaram os toques. Tente um caminho mais direto.');
    dica(J.dono===L.craque?'A bola está com seu craque ★. Chute ou siga tocando.':'Passe certo! Continue a jogada.');
  }
}
function terminar(venceu,msg,scout){
  const L=J.L,C=T.carreira,doCraque=J.voo&&J.voo.chutador===L.craque,emRodada=M.rodada<=TOTAL_RODADAS;
  J.estado='fim';
  const pend=pendMinha();pend.fases++;
  let titulo,estrelas=0;const linhas=[];
  if(venceu){
    let falha=null;
    if(L.obj==='craque'&&!doCraque)falha='Gol, mas o objetivo era o gol do seu craque ★.';
    if(L.obj==='passes3'&&J.passes<3)falha=`Gol, mas o objetivo pedia 3 passes antes (você deu ${J.passes}).`;
    if(falha){titulo='Quase!';msg=falha}
    else{
      titulo='GOOOL!';estrelas=J.toques<=L.par?3:J.toques<=L.par+1?2:1;
      const antes=C.estrelas[L.n]||0;
      if(estrelas>antes){const g=estrelas-antes;C.estrelas[L.n]=estrelas;T.cash=r2(T.cash+g*0.5);linhas.push(`+${g} estrela(s) nova(s): +${fmtM(g*0.5)} no caixa`)}
      C.desbloq=Math.max(C.desbloq,Math.min(L.n+1,MAX_FASES));
      if(doCraque){pend.G++;C.gols++;if(emRodada)linhas.push(`Gol do craque: +1 G na rodada ${M.rodada}`)}
      else if(J.ultimoPasse===L.craque){pend.A++;if(emRodada)linhas.push(`Assistência do craque: +1 A na rodada ${M.rodada}`)}
      else if(emRodada)linhas.push('O craque não participou do gol, mas já entra em campo na rodada.');
      msg='Toques usados: '+J.toques+'.';
    }
  }else{
    titulo='Não foi dessa vez';
    if(scout&&doCraque){pend[scout]++;if(emRodada)linhas.push(`Finalização do craque: +1 ${scout} na rodada ${M.rodada}`)}
  }
  salvarTime();renderPlacar();dica(titulo+' '+(msg||''));
  const ov=$('#overlay');if(!ov)return;
  const prox=venceu&&estrelas>0&&L.n<MAX_FASES;
  ov.innerHTML=`<div class="caixa"><div class="titulo ${estrelas?'':'falhou'}">${titulo}</div>
    ${estrelas?`<div class="estrelas">${[1,2,3].map(i=>`<span class="${i<=estrelas?'estrela':'off'}">★</span>`).join('')}</div>`:''}
    <p>${esc(msg||'')}</p>${linhas.map(l=>`<p class="muted" style="margin:0">${esc(l)}</p>`).join('')}
    <div class="linha-acoes" style="justify-content:center">
      <button class="btn" data-act="repetirFase">Repetir fase</button>
      ${prox?'<button class="btn principal" data-act="proximaFase">Próxima fase</button>':''}
      <button class="btn" data-act="ir" data-aba="painel">Ir ao Painel</button></div></div>`;
  ov.hidden=false;
  renderLateralCarreira();
}
function desenhar(){
  const c=J.ctx,L=J.L;if(!c||!L)return;
  c.setTransform(J.dpr,0,0,J.dpr,0,0);
  for(let i=0;i<10;i++){c.fillStyle=i%2?'#23863f':'#1f7a3c';c.fillRect(0,i*60,W,60)}
  c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=2;
  c.strokeRect(10,GOL_Y,W-20,H);c.strokeRect(85,GOL_Y,230,120);c.strokeRect(145,GOL_Y,110,40);
  c.beginPath();c.arc(200,108,50,0.2*Math.PI,0.8*Math.PI);c.stroke();
  c.beginPath();c.arc(200,H,62,Math.PI,2*Math.PI);c.stroke();
  c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.arc(200,108,2.5,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.14)';c.fillRect(GOL_X1,2,GOL_X2-GOL_X1,GOL_Y-2);

  for(let x=GOL_X1;x<=GOL_X2;x+=8){c.moveTo(x,2);c.lineTo(x,GOL_Y)}for(let y=2;y<=GOL_Y;y+=6){c.moveTo(GOL_X1,y);c.lineTo(GOL_X2,y)}c.stroke();
  c.strokeStyle='#ffffff';c.lineWidth=4;c.beginPath();c.moveTo(GOL_X1,GOL_Y);c.lineTo(GOL_X1,2);c.lineTo(GOL_X2,2);c.lineTo(GOL_X2,GOL_Y);c.stroke();
  if(J.estado==='desenhando'&&J.alvo&&J.alvo.tipo==='chute'){c.fillStyle='rgba(255,210,63,.35)';c.fillRect(GOL_X1,2,GOL_X2-GOL_X1,GOL_Y-2)}
  c.fillStyle='rgba(255,90,70,.16)';
  for(const d of L.def){c.beginPath();c.arc(d.x,d.y,L.alcDef+6,0,7);c.fill()}
  c.beginPath();c.arc(L.goleiro.x,L.goleiro.y,L.alcGol+6,0,7);c.fill();
  if(J.estado==='desenhando'&&J.traco.length>1){
    c.save();c.setLineDash([8,7]);c.lineWidth=4;c.lineCap='round';c.lineJoin='round';
    c.strokeStyle=J.alvo?'#ffd23f':'rgba(255,255,255,.7)';c.beginPath();c.moveTo(J.traco[0].x,J.traco[0].y);for(const p of J.traco)c.lineTo(p.x,p.y);c.stroke();c.restore();
    const f=J.traco[J.traco.length-1];
    c.fillStyle=J.alvo?'#ffd23f':'#ff6b5a';c.beginPath();c.arc(f.x,f.y,5,0,7);c.fill();
    c.fillStyle='rgba(0,0,0,.45)';c.fillRect(8,H-26,150,18);c.fillStyle='#eef3ec';c.font='600 12px Barlow, sans-serif';
    c.fillText(`Força do traço ${Math.round(J.len/MAX_TRACO*100)}%`,14,H-13);
  }
  if(J.estado==='voando'&&J.voo){
    const v=J.voo;c.save();c.setLineDash([3,6]);c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=2;c.beginPath();
    let first=true;for(let i=0;i<v.pts.length;i++){if(v.cum[i]<v.s)continue;const p=v.pts[i];if(first){c.moveTo(J.bola.x,J.bola.y);first=false}c.lineTo(p.x,p.y)}c.stroke();c.restore();
  }

  boneco(L.goleiro.x,L.goleiro.y,'#ff8a3d','#1b1b1b',12);
  L.comp.forEach((p,i)=>{
    const alvo=J.estado==='desenhando'&&J.alvo&&J.alvo.tipo==='passe'&&J.alvo.i===i;
    if(i===J.dono&&J.estado!=='voando'){c.strokeStyle='#ffd23f';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,21+Math.sin(performance.now()/180)*2,0,7);c.stroke()}
    if(alvo){c.strokeStyle='#4ade80';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,22,0,7);c.stroke()}
    boneco(p.x,p.y,meu.c1,meu.c2,13);
    if(i===L.craque){c.fillStyle='#ffd23f';c.font='16px sans-serif';c.textAlign='center';c.fillText('★',p.x,p.y-17);
      c.font='700 11px Barlow, sans-serif';c.fillStyle='#ffffff';c.fillText(T.carreira.nome.slice(0,14),p.x,p.y+28);c.textAlign='left'}
  });
  const parado=J.estado!=='voando'&&J.estado!=='fim',b=parado?L.comp[J.dono]:J.bola;
  const bx=parado?b.x+9:b.x,by=parado?b.y-9:b.y;
  c.fillStyle='#ffffff';c.strokeStyle='#111';c.lineWidth=1.5;c.beginPath();c.arc(bx,by,6,0,7);c.fill();c.stroke();
  c.fillStyle='#111';c.beginPath();c.arc(bx,by,2.2,0,7);c.fill();
}
function laco(t){
  const dt=Math.min(0.033,(t-(J.t0||t))/1000);J.t0=t;
  atualizar(dt);desenhar();
  J.raf=requestAnimationFrame(laco);
}
function pararJogo(){if(J.raf)cancelAnimationFrame(J.raf);J.raf=0;J.t0=0}
function montarCarreira(m,faixa){
  const C=T.carreira;
  if(!C.criado){
    m.innerHTML=faixa+`<div class="grade"><div class="card"><h2>Crie seu craque</h2>
      <p class="muted">Ele é um jogador fictício seu: joga as fases da Carreira e aparece só no seu mercado, no clube que você escolher.</p>
      <form class="form-craque" id="form-craque">
        <label for="crq-nome">Nome de craque<input id="crq-nome" maxlength="16" required placeholder="Ex.: Joãozinho Raio" autocomplete="off"></label>
        <label for="crq-pos">Posição<select id="crq-pos"><option value="ATA">Atacante</option><option value="MEI">Meia</option></select></label>
        <label for="crq-clube">Clube<select id="crq-clube">${CLUBES.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></label>
        <button class="btn principal" type="submit" ${MODO==='online'&&!podeEscrever?'disabled':''}>Criar meu craque</button></form></div>
      <div class="card"><h2>Como se joga</h2><ul>
        <li>Arraste a partir da bola e solte em cima de um companheiro para tocar.</li>
        <li>Solte o traço dentro do gol para chutar. O traço é o caminho exato da bola: curvas valem.</li>
        <li>Fuja das áreas vermelhas. Marcadores perto da bola correm para cortar.</li>
        <li>Quanto menos toques, mais estrelas.</li></ul></div></div>`;
    return;
  }
  m.innerHTML=faixa+`<div class="carreira">
    <div class="jogo">
      <div class="hud" id="hud"></div>
      <div class="contexto" id="contexto"></div>
      <div class="tela"><canvas id="cv" aria-label="Campo de jogo: desenhe o caminho da bola"></canvas><div class="overlay" id="overlay" hidden></div></div>
      <div class="dica" id="dica" aria-live="polite"></div>
      <div class="linha-acoes"><button class="btn" data-act="repetirFase">Reiniciar fase</button></div>
    </div>
    <div class="card" id="lateral"></div></div>`;
  J.cv=$('#cv');J.ctx=J.cv.getContext('2d');J.dpr=Math.min(window.devicePixelRatio||1,2);
  J.cv.width=W*J.dpr;J.cv.height=H*J.dpr;
  ligarEntrada(J.cv);
  iniciarFase(J.L&&J.n<=C.desbloq?J.n:C.desbloq);
  renderLateralCarreira();
  pararJogo();J.raf=requestAnimationFrame(laco);
}
function renderLateralCarreira(){
  const C=T.carreira,el=$('#lateral');if(!el)return;
  const sc=craqueScouts(T,M)||{},pts=pontos(sc),fases=pendValida(T).fases,noTime=T.escalacao.includes('CRQ');
  el.innerHTML=`<h2><span class="estrela">★</span> ${esc(C.nome)}</h2>
    <p class="muted">${POS_NOME[C.pos]} do ${escudo(C.clube)} ${esc(CLUBES[C.clube].nome)} · preço ${fmtM(precoCraqueDe(T))} · ${estrelasDe(T)} de ${MAX_FASES*3} estrelas</p>
    ${M.rodada<=TOTAL_RODADAS?`<h3>Garantido para a rodada ${M.rodada}</h3>
    <div class="pend"><div><b>${sc.G||0}</b><small>Gols</small></div><div><b>${sc.A||0}</b><small>Assist.</small></div><div><b>${(sc.FD||0)+(sc.FF||0)}</b><small>Finaliz.</small></div><div><b class="estrela">${fmt(pts)}</b><small>Pontos</small></div></div>
    <p class="muted" style="font-size:13px">${fases>0?(noTime?'Ele está no seu time e vai entrar em campo.':'Ele vai entrar em campo, mas não está no seu time. Compre-o na Escalação para somar esses pontos.'):'Jogue ao menos uma fase para ele entrar em campo nesta rodada.'}</p>`:''}
    <h3 style="margin-top:14px">Fases</h3>
    <div class="fases">${Array.from({length:MAX_FASES},(_,i)=>{const n=i+1,e=C.estrelas[n]||0;
      return`<button class="fase-btn ${n===J.n?'atual':''}" data-act="fase" data-n="${n}" ${n>C.desbloq?'disabled':''} aria-label="Fase ${n}"><b>${n}</b><small>${n>C.desbloq?'🔒':'★'.repeat(e)+'·'.repeat(3-e)}</small></button>`}).join('')}</div>`;
}

/* ======================= eventos ======================= */
const ACOES={
  ir:d=>irPara(d.aba),
  fecharRodada:()=>fecharRodada(),
  comprar:d=>comprar(d.id),
  vender:d=>vender(d.id),
  capitao:d=>{if(travado())return;T.capitao=T.capitao===d.id?null:d.id;salvarTime();renderMercado()},
  filtrarPos:d=>{filtros.pos=d.pos;const s=$('#f-pos');if(s)s.value=d.pos;renderMercado();const l=$('#mercado');if(l&&window.innerWidth<900)l.scrollIntoView({behavior:'smooth',block:'start'})},
  auto:()=>autoEscalar(),
  limpar:()=>{if(travado())return;for(const id of T.escalacao)T.cash=r2(T.cash+dyn(id).price);T.escalacao=[];T.capitao=null;salvarTime();renderPlacar();renderMercado()},
  novaTemporada:async()=>{
    try{await salvarMundo(novoMundo((M.temporada||1)+1,MODO==='solo'));ajustarTemporada();render();toast('Nova temporada começou. Monte seu time!')}
    catch(e){toast('Não consegui começar a nova temporada agora.')}
  },
  repetirFase:()=>{iniciarFase(J.n);renderLateralCarreira()},
  proximaFase:()=>{iniciarFase(Math.min(J.n+1,T.carreira.desbloq));renderLateralCarreira()},
  fase:d=>{iniciarFase(+d.n);renderLateralCarreira()},
  resetar:(d,b)=>{
    if(b.dataset.confirma){try{localStorage.removeItem(KEY_SOLO)}catch(e){}M=novoMundo(1,true);T=timeNovo('Seu time',1);J.L=null;salvarSolo();irPara('painel');toast('Tudo apagado. Bom recomeço!');return}
    b.dataset.confirma='1';b.textContent='Clique de novo para confirmar';setTimeout(()=>{if(b.isConnected){delete b.dataset.confirma;b.textContent='Apagar tudo e recomeçar'}},4000);
  }
};
document.addEventListener('click',e=>{
  const aba=e.target.closest('#abas button');if(aba)return irPara(aba.dataset.aba);
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=ACOES[b.dataset.act];if(f)f(b.dataset,b);
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='sel-formacao')return trocarFormacao(e.target.value);
  if(id==='f-pos')filtros.pos=e.target.value;else if(id==='f-clube')filtros.clube=e.target.value;else if(id==='f-ordem')filtros.ordem=e.target.value;
  else if(id==='f-cabe')filtros.cabe=e.target.checked;else if(id==='f-disp')filtros.disp=e.target.checked;else return;
  renderMercado();
});
document.addEventListener('input',e=>{if(e.target.id==='f-busca'){filtros.busca=e.target.value;renderMercado()}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='form-craque'){
    const nome=$('#crq-nome').value.trim();if(!nome)return toast('Dê um nome ao seu craque.');
    const C=T.carreira;C.criado=true;C.nome=nome.slice(0,16);C.pos=$('#crq-pos').value;C.clube=+$('#crq-clube').value;
    salvarTime();render();toast(`${C.nome} chegou ao ${CLUBES[C.clube].nome}! Jogue a fase 1.`);
  }else if(e.target.id==='form-time'){
    const nome=$('#nome-time').value.trim();if(!nome)return toast('Dê um nome ao seu time.');
    T=timeNovo(nome.slice(0,28),M.temporada);salvarTime();gravarTimeAgora();render();toast(`${T.nome} entrou na liga! Agora monte a escalação.`);
  }
});

/* ======================= inicialização ======================= */
function ajustarTemporada(){
  if(!M||!T)return;
  if(T.temporada!==M.temporada){T.temporada=M.temporada;T.cash=100;T.escalacao=[];T.capitao=null;salvarTime()}
  const validos=T.escalacao.filter(id=>id==='CRQ'||PMAP[id]);
  if(validos.length!==T.escalacao.length){T.escalacao=validos;if(T.capitao&&!validos.includes(T.capitao))T.capitao=null;salvarTime()}
}
function iniciarSolo(){
  MODO='solo';
  let salvo=null;try{const t=localStorage.getItem(KEY_SOLO);if(t)salvo=JSON.parse(t)}catch(e){}
  if(salvo&&salvo.M&&salvo.M.v===2&&salvo.T){M=salvo.M;T=salvo.T}else{M=novoMundo(1,true);T=timeNovo('Seu time',1);salvarSolo()}
  ajustarTemporada();render();
}
let criandoMundo=false;
async function iniciarOnline(){
  MODO='online';render();
  souDono=await usr.isOwner();
  const pode=await usr.can('data.write');if(pode===false)podeEscrever=false;
  db.doc('liga/mundo').onSnapshot(s=>{
    mundoCarregado=true;
    if(!s.exists){M=null;
      if(souDono&&!criandoMundo){criandoMundo=true;db.doc('liga/mundo').set(novoMundo(1,false)).catch(()=>{criandoMundo=false;toast('Não consegui criar a liga. Recarregue a página.')})}}
    else{M=clone(s.data());if(!T&&TIMES[meuId])T=clone(TIMES[meuId]);ajustarTemporada()}
    atualizarVista();
  },()=>{toast('A conexão com a liga caiu. Recarregue a página.')});
  db.collection('times').onSnapshot(q=>{
    timesCarregados=true;TIMES={};
    q.docs.forEach(d=>{if(d.exists)TIMES[d.id]=d.data()});
    const server=TIMES[meuId];
    if(server&&(!T||(!escritaPendente&&!q.metadata.hasPendingWrites&&JSON.stringify(server)!==JSON.stringify(T)))){T=clone(server);if(J.L&&J.n>T.carreira.desbloq)J.L=null}
    if(M)ajustarTemporada();
    atualizarVista();
  },()=>{toast('A conexão com a liga caiu. Recarregue a página.')});
}
(async function iniciar(){
  render();
  if(!window.claude||typeof window.claude.use!=='function')return iniciarSolo();
  try{
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(d&&u){const id=await u.id();if(id){db=d;usr=u;meuId=id;return iniciarOnline()}}
  }catch(e){}
  iniciarSolo();
})();
</script>
